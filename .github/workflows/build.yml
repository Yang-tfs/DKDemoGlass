name: build DKDemoGlass

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          brew install ldid xz dpkg || true
          export THEOS="$RUNNER_TEMP/theos"
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          # theos 仓库自带一个空的 sdks 目录，必须先清掉才能 clone 真正的 SDK 仓库
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build dylib
        run: make dylib

      - name: Verify dylib
        run: |
          set -e
          file packages/DKDemoGlass.dylib
          echo "--- install name ---"
          otool -D packages/DKDemoGlass.dylib
          echo "--- linked libs ---"
          otool -L packages/DKDemoGlass.dylib
          if otool -L packages/DKDemoGlass.dylib | grep -qi substrate; then
            echo "::warning::dylib 链接了 substrate，TrollFools 环境下会加载失败"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DKDemoGlass-dylib
          path: packages/DKDemoGlass.dylib
          if-no-files-found: error
