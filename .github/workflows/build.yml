name: build DKDemoGlass

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS runner 在这台账号上两次都是"排队 15 分钟、零步骤被取消"，改走 Linux runner。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos (Linux)
        uses: Randomblock1/theos-action@v1

      - name: Build dylib
        run: make dylib

      - name: Verify dylib
        run: |
          set -e
          ls -l packages/DKDemoGlass.dylib
          echo "ldid: $(command -v ldid || echo '(none)')"
          python3 - <<'PY'
          import re
          import struct

          path = 'packages/DKDemoGlass.dylib'
          data = open(path, 'rb').read()
          magic, cputype, cpusub, filetype = struct.unpack_from('<IiiI', data, 0)
          print('magic=0x%X cputype=0x%X filetype=%d size=%d'
                % (magic, cputype, filetype, len(data)))
          text = data.decode('latin-1')
          match = re.search(r'@executable_path/[A-Za-z/]*DKDemoGlass\.dylib', text)
          print('install name:', match.group(0) if match else '(not found)')
          print('substrate linked:', 'substrate' in text)
          if filetype != 6:
              raise SystemExit('not a Mach-O dylib')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: DKDemoGlass-dylib
          path: packages/DKDemoGlass.dylib
          if-no-files-found: error
