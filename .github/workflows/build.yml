name: build DKDemoGlass

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          brew install ldid xz dpkg || true
          export THEOS="$RUNNER_TEMP/theos"
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          # theos 浠撳簱鑷甫涓€涓┖鐨?sdks 鐩綍锛屽繀椤诲厛娓呮帀鎵嶈兘 clone 鐪熸鐨?SDK 浠撳簱
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build dylib
        run: make dylib

      - name: Verify dylib
        run: |
          set -e
          file packages/DKDemoGlass.dylib
          echo "--- install name ---"
          otool -D packages/DKDemoGlass.dylib
          echo "--- linked libs ---"
          otool -L packages/DKDemoGlass.dylib
          if otool -L packages/DKDemoGlass.dylib | grep -qi substrate; then
            echo "::warning::dylib 閾炬帴浜?substrate锛孴rollFools 鐜涓嬩細鍔犺浇澶辫触"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DKDemoGlass-dylib
          path: packages/DKDemoGlass.dylib
          if-no-files-found: error
